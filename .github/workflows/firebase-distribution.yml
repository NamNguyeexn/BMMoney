name: Android Firebase App Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create google-services.json from secret
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GS_JSON" > app/google-services.json
          python3 -c "import json;d=json.load(open('app/google-services.json'));assert any(c.get('client_type')==3 for c in d['client'][0].get('oauth_client',[])),'Thieu oauth_client type 3'"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Recovery debug keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/debug.keystore
          ls -la keystore/

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thu-chi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: namnk
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Bản cập nhật tự động từ GitHub Actions.
            Version: 1.0.${{ github.run_number }}
            Commit: ${{ github.sha }}
