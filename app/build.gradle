plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android { namespace 'com.example.bmmoney'; compileSdk 35
    defaultConfig { applicationId 'com.example.expensemanager'; minSdk 23; targetSdk 35; versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1'); versionName System.getenv('VERSION_NAME') ?: '1.0' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
