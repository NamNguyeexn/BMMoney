plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.bmmoney'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.bmmoney'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '2.0'
    }

    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    // Can ban 1.8+ cho PickVisualMedia / PickMultipleVisualMedia (bo chon anh cua
    // he thong, khong doi quyen READ_MEDIA_IMAGES). fragment 1.8.5 da keo ve ban nay,
    // khai bao tuong minh de khong bi ha bac khi doi thu vien khac.
    implementation 'androidx.activity:activity:1.9.3'
    // Lo xo cho nut + noi: cho phep tha nut bay ve canh voi quan tinh that,
    // thay vi mot duong truot deu vo hon.
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation platform('com.google.firebase:firebase-bom:34.8.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'

    // Ban va 03/09 - DOC ANH GIAO DICH NGAY TREN MAY.
    //
    // Ban -bundled: mo hinh chu Latin duoc NHUNG THANG vao APK (khoang 4 MB), nen
    // lan doc dau tien khong phai tai gi va khong can mang. Ban khong nhung
    // (play-services-mlkit-text-recognition) nhe hon nhung phai tai mo hinh qua
    // Google Play services, va lan dau khong co mang thi that bai - dieu nay pha
    // vo dung cai ma tinh nang can: doc duoc bien lai o bat ky dau.
    //
    // Mo hinh nay KHONG gan voi tai khoan Google nao. Dang nhap Google chi phuc vu
    // sao luu Firestore, hai viec doc lap nhau.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
